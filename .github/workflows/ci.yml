name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify M3 cold-start transfer budget (<= 1 MiB gzip)
        if: hashFiles('tools/check-transfer-budget.mjs') != ''
        run: node tools/check-transfer-budget.mjs
